<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino Saep Pedrinho</title>
</head>
<body>
    <h1>Frontend + Backend + Banco de dados</h1>
    <p>Cada botão chama um método HTTP</p>

    <hr>

    <section>
    <h2>Get - Listar alunos</h2>
    <button id="btnGet">Listagem de alunos</button>
    <div id="lista"></div>
    </section>
<hr>
    <section>
    <h2>Post - Criar alunos</h2>
    <input id="nomePost" placeholder="Digite o nome">
    <input id="emailPost" placeholder="Digite o email">
    <input id="senhaPost" placeholder="Digite a senha">
    <button id="btnPost">cadastrar</button>
    </section>
<hr>
    <section>
    <h2>Put - Respawnar alunos</h2>
    <input id="nomePut" placeholder="Digite o nome">
    <input id="emailPut" placeholder="Digite o email">
    <input id="senhaPut" placeholder="Digite a senha">
    <button id="btnPut">Atualisar</button>
    </section>
<hr>
    <section>
    <h2>Delete - Desintegrar alunos</h2>
    <input id="nomeDelete" placeholder="Digite o nome">
    <input id="emailDelete" placeholder="Digite o email">
    <input id="senhaDelete" placeholder="Digite a senha">
    <button id="btnDelete">Deletar</button>
    </section>

    <script src="script.js" defer></script>

</body>
</html>
